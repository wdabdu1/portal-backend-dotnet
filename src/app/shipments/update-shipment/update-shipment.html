<div style="max-width: 700px; margin: 2rem auto; font-family: sans-serif; padding: 0 1rem;">
  <p *ngIf="loading" style="color: #888; font-size: 13px;">Loading...</p>
  <p *ngIf="error" style="color: #c0392b; font-size: 13px;">{{ error }}</p>

  <div *ngIf="!loading && detail">
    <h1 style="font-size: 20px; font-weight: 500;">Shipment {{ detail.blAwbNo }}</h1>
    <p style="color: #888; font-size: 13px;">PO {{ detail.poNumber }} — Status: {{ detail.status }}</p>

    <div style="border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-top: 1.5rem;">
      <h3 style="font-size: 15px; margin: 0 0 12px;">Forwarder</h3>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
        <div>
          <label style="display:block; font-size:12px; color:#555;">Forwarder</label>
          <select [(ngModel)]="forwarderForm.forwarderId" style="width:100%; padding:6px;">
            <option [ngValue]="null">-- select --</option>
            <option *ngFor="let f of forwarders" [ngValue]="f.id">{{ f['name'] }}</option>
          </select>
        </div>
        <div>
          <label style="display:block; font-size:12px; color:#555;">Actual Shipping Cost</label>
          <input type="number" [(ngModel)]="forwarderForm.actualShippingCost" style="width:100%; padding:6px;" />
        </div>
        <div>
          <label style="display:block; font-size:12px; color:#555;">Currency</label>
          <select [(ngModel)]="forwarderForm.currencyId" style="width:100%; padding:6px;">
            <option [ngValue]="null">-- select --</option>
            <option *ngFor="let c of currencies" [ngValue]="c.id">{{ c['code'] }}</option>
          </select>
        </div>
        <div>
          <label style="display:block; font-size:12px; color:#555;">Amount Saved</label>
          <input type="number" [(ngModel)]="forwarderForm.amountSaved" style="width:100%; padding:6px;" />
        </div>
        <div style="display:flex; align-items:center; gap:6px; padding-top:20px;">
          <input type="checkbox" [(ngModel)]="forwarderForm.marineInsurance" id="marine" />
          <label for="marine" style="font-size:13px;">Marine Insurance</label>
        </div>
      </div>
      <button (click)="saveForwarder()" [disabled]="forwarderSaving" style="margin-top:12px; padding:6px 14px; background:#0a3d62; color:white; border:none; border-radius:4px; cursor:pointer;">{{ forwarderSaving ? 'Saving...' : 'Save' }}</button>
      <span *ngIf="forwarderSaved" style="color:#2a7d2a; font-size:12px; margin-left:8px;">Saved</span>
    </div>

    <div style="border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-top: 1rem;">
      <h3 style="font-size: 15px; margin: 0 0 12px;">ACD</h3>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
        <div>
          <label style="display:block; font-size:12px; color:#555;">Process Date</label>
          <input type="date" [(ngModel)]="acdForm.processDate" style="width:100%; padding:6px;" />
        </div>
        <div>
          <label style="display:block; font-size:12px; color:#555;">Cost (USD)</label>
          <input type="number" [(ngModel)]="acdForm.costUsd" style="width:100%; padding:6px;" />
        </div>
        <div>
          <label style="display:block; font-size:12px; color:#555;">Cost Settled Date</label>
          <input type="date" [(ngModel)]="acdForm.costSettledDate" style="width:100%; padding:6px;" />
        </div>
        <div>
          <label style="display:block; font-size:12px; color:#555;">Reference Number</label>
          <input [(ngModel)]="acdForm.refNumber" style="width:100%; padding:6px;" />
        </div>
      </div>
      <button (click)="saveAcd()" [disabled]="acdSaving" style="margin-top:12px; padding:6px 14px; background:#0a3d62; color:white; border:none; border-radius:4px; cursor:pointer;">{{ acdSaving ? 'Saving...' : 'Save' }}</button>
      <span *ngIf="acdSaved" style="color:#2a7d2a; font-size:12px; margin-left:8px;">Saved</span>
    </div>

    <p style="color:#888; font-size:12px; margin-top:1.5rem;">More sections (Draft Documents, SSMO, MOT, Supplier Full Set, Supplier Payment, Banking) coming next.</p>
  </div>
</div>
